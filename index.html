<style>
  :root {
    --bg: #070b1a;
    --bg2: #0d1330;
    --panel: #111a3a;
    --panel-2: #172249;
    --cuerpo: #1f2640;
    --cuerpo-claro: #2b3558;
    --texto: #e6ecff;
    --suave: #8b97c4;
    --borde: rgba(120, 140, 255, .18);
    --cian: #00e5ff;
    --cian-suave: rgba(0, 229, 255, .35);
    --violeta: #6c4cff;
    --violeta-2: #9a5cff;
    --glow: 0 0 24px rgba(0, 229, 255, .25);
    --sombra: 0 10px 40px rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(108, 76, 255, .25), transparent 60%),
      radial-gradient(800px 500px at 110% 110%, rgba(0, 229, 255, .18), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(120, 140, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 140, 255, .05) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 80%);
  }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s, border-color .2s; }
  button:active { transform: scale(.97); }

  /* ---------- Robot face (reutilizable) ---------- */
  .robot {
    position: relative; display: grid; place-items: center;
    background: linear-gradient(160deg, #2c3557, #151b33);
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: inset 0 2px 6px rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.4);
  }
  .robot .pantalla {
    position: absolute; background: #05070f;
    box-shadow: inset 0 0 0 2px #39416b, 0 0 0 1px rgba(255,255,255,.05);
  }
  .robot .ojos { display: flex; gap: 14%; align-items: center; justify-content: center; }
  .robot .ojo {
    background: var(--cian); border-radius: 30%;
    box-shadow: 0 0 10px var(--cian), 0 0 22px rgba(0,229,255,.55);
    animation: parpadeo 5s infinite;
  }
  .robot .ojo.der { animation-delay: .08s; }
  @keyframes parpadeo {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }
  .robot .auricular {
    position: absolute; top: -18%; left: -10%; right: -10%; height: 58%;
    border: 6px solid var(--violeta); border-bottom: 0; border-radius: 999px 999px 0 0;
    box-shadow: 0 0 14px rgba(108,76,255,.5);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px; padding: 12px 22px;
    background: rgba(13, 19, 48, .75); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--borde);
  }
  .avatar { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; }
  .avatar .pantalla { inset: 20% 16%; border-radius: 8px; }
  .avatar .ojo { width: 6px; height: 9px; }
  .avatar .ojos { position: absolute; inset: 0; }
  .avatar .auricular { top: -14%; left: -6%; right: -6%; height: 50%; border-width: 3px; }
  .marca { flex: 1; min-width: 0; }
  .marca b { display: block; font-size: 17px; letter-spacing: .3px; }
  .estado { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--suave); }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: #3dffa2; box-shadow: 0 0 8px #3dffa2; animation: pulso 2s infinite; }
  @keyframes pulso { 50% { opacity: .4; } }

  .boton {
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--borde);
    background: rgba(255,255,255,.03); font-size: 14px; font-weight: 500;
  }
  .boton:hover { border-color: var(--cian-suave); box-shadow: var(--glow); }
  .boton.principal {
    background: linear-gradient(135deg, var(--violeta), var(--cian));
    border: 0; color: #04101a; font-weight: 700;
  }
  .boton.principal:hover { box-shadow: 0 0 22px rgba(0,229,255,.45); }

  /* ---------- Login ---------- */
  #login-container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 18px; text-align: center; padding: 24px; max-width: 480px; margin: 0 auto; width: 100%;
  }
  .login-robot { width: 150px; height: 150px; border-radius: 42px; }
  .login-robot .pantalla { inset: 26% 18%; border-radius: 22px; }
  .login-robot .ojo { width: 26px; height: 36px; }
  .login-robot .auricular { top: -16%; left: -12%; right: -12%; height: 52%; border-width: 10px; }
  .login-robot .ojos { position: absolute; inset: 0; }
  #login-container h2 {
    margin: 6px 0 0; font-size: 28px; letter-spacing: -.3px;
    background: linear-gradient(90deg, #fff, var(--cian));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #login-container p { margin: 0; color: var(--suave); line-height: 1.6; font-size: 15px; }
  .campo {
    padding: 14px 18px; border-radius: 12px; border: 1px solid var(--borde);
    background: var(--bg2); font-size: 16px; width: 100%; text-align: center; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .campo:focus { border-color: var(--cian); box-shadow: var(--glow); }
  #loginBtn { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; }

  /* ---------- Chat ---------- */
  #chat { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 28px 18px; display: none; scroll-behavior: smooth; }
  #mensajes { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .fila-msg { display: flex; gap: 10px; align-items: flex-end; animation: entrar .35s ease; }
  .fila-msg.usuario { justify-content: flex-end; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .mini-robot { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; }
  .mini-robot .pantalla { inset: 22% 14%; border-radius: 6px; }
  .mini-robot .ojo { width: 4px; height: 6px; }
  .mini-robot .ojos { position: absolute; inset: 0; }
  .mini-robot .auricular { top: -16%; left: -8%; right: -8%; height: 50%; border-width: 2px; }

  .msg {
    max-width: 78%; padding: 13px 17px; border-radius: 18px; line-height: 1.6;
    word-break: break-word; font-size: 15px; white-space: pre-wrap;
  }
  .usuario.msg {
    background: linear-gradient(135deg, var(--violeta), #3a5bff);
    color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 6px 20px rgba(108,76,255,.3);
  }
  .eloboth.msg {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--borde); border-bottom-left-radius: 4px;
    box-shadow: var(--sombra); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 14px;
  }
  .eloboth.msg::before {
    content: "eloboth@chat:~$ "; display: block; color: var(--cian); font-size: 12px; opacity: .8; margin-bottom: 6px;
  }
  .eloboth.pensando { color: var(--suave); }
  .eloboth.pensando::before { content: none; }
  .puntos span {
    display: inline-block; width: 6px; height: 6px; margin: 0 3px; border-radius: 50%;
    background: var(--cian); animation: rebote 1.2s infinite ease-in-out;
  }
  .puntos span:nth-child(2) { animation-delay: .15s; }
  .puntos span:nth-child(3) { animation-delay: .3s; }
  @keyframes rebote { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

  pre { background: #05070f; color: #bfe9ff; padding: 14px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--borde); margin: 8px 0 0; }
  code { font-family: ui-monospace, Consolas, monospace; background: rgba(0,229,255,.08); color: var(--cian); padding: 2px 6px; border-radius: 6px; }

  /* ---------- Entrada ---------- */
  #entrada {
    position: relative; z-index: 2;
    background: rgba(13, 19, 48, .8); backdrop-filter: blur(10px);
    border-top: 1px solid var(--borde); padding: 16px; display: none;
  }
  #entrada .fila {
    max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg2); border: 1px solid var(--borde); border-radius: 16px; padding: 8px 8px 8px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  #entrada .fila:focus-within { border-color: var(--cian-suave); box-shadow: var(--glow); }
  #texto {
    flex: 1; min-width: 0; resize: none; min-height: 44px; max-height: 180px; padding: 10px 0;
    border: 0; background: transparent; outline: none;
  }
  #texto::placeholder { color: var(--suave); }
  #enviar { padding: 11px 20px; border-radius: 12px; }

  /* ---------- Layout con barra de conversaciones ---------- */
  #cuerpo { position: relative; z-index: 1; flex: 1; display: flex; min-height: 0; }
  #principal { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #barra {
    width: 260px; flex-shrink: 0; display: none; flex-direction: column; gap: 12px; padding: 14px;
    background: rgba(13, 19, 48, .7); border-right: 1px solid var(--borde); min-height: 0;
  }
  body.con-sesion #barra { display: flex; }
  #barra h3 {
    margin: 6px 4px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--suave);
  }
  #nuevaChat { width: 100%; padding: 10px; border-radius: 12px; }
  #listaChats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-item {
    display: flex; align-items: center; gap: 6px; padding: 10px; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent;
  }
  .chat-item:hover { background: rgba(255, 255, 255, .04); }
  .chat-item.activo { border-color: var(--cian-suave); background: rgba(0, 229, 255, .07); }
  .chat-item .titulo {
    flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-item .borrar {
    background: none; border: 0; color: var(--suave); padding: 2px 6px; border-radius: 6px; font-size: 13px;
  }
  .chat-item .borrar:hover { color: #ff6b8a; }
  @media (max-width: 700px) {
    #barra { width: 200px; }
  }

  /* ---------- Imágenes ---------- */
  .previa {
    display: flex; align-items: center; gap: 12px; max-width: 860px; margin: 0 auto 10px;
    padding: 8px; background: var(--bg2); border: 1px solid var(--cian-suave); border-radius: 14px;
  }
  .previa[hidden] { display: none !important; }
  #previaImg { height: 56px; width: auto; border-radius: 8px; border: 1px solid var(--borde); }
  .previa .boton { margin-left: auto; }
  .msg-img { display: block; max-width: 100%; max-height: 320px; border-radius: 12px; }

  /* ---------- Robot más lindo (cabeza, pantalla y ojos) ---------- */
  .robot {
    background: linear-gradient(160deg, #3a4585, #161d3d 65%, #0c1126);
    box-shadow:
      inset 0 2px 8px rgba(255, 255, 255, .18),
      inset 0 -6px 12px rgba(0, 0, 0, .35),
      0 8px 26px rgba(0, 229, 255, .28),
      0 0 0 1px rgba(108, 76, 255, .45);
  }
  .robot .pantalla {
    background: radial-gradient(circle at 50% 30%, #13204a, #05070f 72%);
    box-shadow: inset 0 0 0 2px #4a5598, inset 0 0 14px rgba(0, 229, 255, .18), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .robot .ojo { animation: parpadeo 5s infinite, brillo-ojo 3s ease-in-out infinite; }
  .robot .ojo.der { animation-delay: .08s, .4s; }
  @keyframes brillo-ojo {
    50% { box-shadow: 0 0 16px var(--cian), 0 0 34px rgba(0, 229, 255, .85); }
  }
  .robot .auricular {
    border-color: #7a5cff;
    box-shadow: 0 0 18px rgba(108, 76, 255, .75), inset 0 0 8px rgba(0, 229, 255, .25);
  }

  /* ---------- Botón de pantalla completa (esquina superior derecha) ---------- */
  .pantalla-btn {
    width: 42px; height: 42px; padding: 0; flex-shrink: 0; border-radius: 13px;
    display: grid; place-items: center; font-size: 18px; line-height: 1;
    background: linear-gradient(135deg, rgba(108, 76, 255, .35), rgba(0, 229, 255, .22));
    border: 1px solid var(--cian-suave); box-shadow: var(--glow);
  }
  .pantalla-btn:hover { box-shadow: 0 0 28px rgba(0, 229, 255, .55); }

  /* ---------- Toques visuales ---------- */
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, var(--violeta), var(--cian), var(--violeta-2), var(--cian));
    background-size: 200% 100%; animation: brillo 6s linear infinite; opacity: .9;
  }
  @keyframes brillo { to { background-position: 200% 0; } }
  .avatar, .login-robot { animation: flotar 4s ease-in-out infinite; }
  @keyframes flotar { 50% { transform: translateY(-4px); } }
  .eloboth.msg { border-left: 3px solid var(--cian); }
  .usuario.msg { border-bottom-right-radius: 6px; }
  .msg code, .msg pre { white-space: pre; }
  .msg pre { white-space: pre-wrap; }
  #chat::-webkit-scrollbar, #listaChats::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb, #listaChats::-webkit-scrollbar-thumb { background: var(--cian-suave); border-radius: 8px; }
  .boton:hover, .chat-item:hover { transform: translateY(-1px); }
  .copiar {
    display: block; margin-top: 10px; padding: 4px 10px; border-radius: 8px; font-size: 12px;
    background: rgba(0, 229, 255, .08); border: 1px solid var(--cian-suave); color: var(--cian);
  }
  .copiar:hover { box-shadow: var(--glow); }
  @media (prefers-reduced-motion: reduce) {
    header::after, .avatar, .login-robot { animation: none; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 600px) {
    .msg { max-width: 88%; font-size: 14px; }
    header { padding: 10px 14px; }
  }
  /* ---------- Celular y tablet ---------- */
  @media (max-width: 900px) {
    #barra { width: 220px; }
  }
  @media (max-width: 700px) {
    #cuerpo { flex-direction: column; }
    #barra {
      width: 100%; max-height: 150px; border-right: 0; border-bottom: 1px solid var(--borde);
      padding: 10px 12px; gap: 8px;
    }
    #barra h3 { display: none; }
    #nuevaChat { width: auto; align-self: flex-start; padding: 8px 14px; }
    #listaChats { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 8px; padding-bottom: 4px; }
    .chat-item { min-width: 170px; max-width: 220px; flex-shrink: 0; }
    .msg { max-width: 92%; }
    #chat { padding: 16px 10px; }
    #entrada { padding: 10px; }
    #entrada .fila { padding: 6px 6px 6px 10px; }
    #enviar { padding: 10px 14px; }
    .previa { margin: 0 0 8px; }
    .login-robot { width: 110px; height: 110px; border-radius: 34px; }
    #login-container h2 { font-size: 22px; }
    header .marca b { font-size: 15px; }
    header { padding: 10px 12px; }
  }
  @media (max-width: 380px) {
    #enviar { padding: 10px; }
    .boton { padding: 7px 10px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
[hidden] { display: none !important; }
.chip-modo {
  display: inline-block; margin: 0 0 8px 8px; padding: 4px 12px; border-radius: 999px;
  font-size: 13px; color: #7dd3fc; border: 1px solid #7dd3fc; background: rgba(0, 212, 255, 0.12);
  user-select: none;
}
.aviso-ia { margin: 6px 0 0; text-align: center; font-size: 12px; color: #8b93b0; }
.menu-modos { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px 8px; }
.menu-modos .boton { font-size: 13px; padding: 6px 12px; }
</style>
</head>
<body>

<header>
  <div class="avatar robot">
    <div class="auricular"></div>
    <div class="pantalla" style="inset:20% 16%;border-radius:8px;"></div>
    <div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div>
  </div>
  <div class="marca">
    <b>Eloboth</b>
    <div class="estado"><span class="punto"></span><span id="userInfo">Sesión no iniciada</span></div>
  </div>
  <button class="boton" id="logoutBtn" type="button" style="display:none;">Salir</button>
  <button class="boton pantalla-btn" id="pantallaBtn" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
</header>
<script>
  // Botón de pantalla completa: entra y sale con la API del navegador
  (function () {
    const btn = document.getElementById("pantallaBtn");
    if (!document.documentElement.requestFullscreen) { btn.style.display = "none"; return; }
    btn.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener("fullscreenchange", () => {
      const grande = Boolean(document.fullscreenElement);
      btn.textContent = grande ? "✖" : "⛶";
      btn.title = grande ? "Salir de pantalla completa" : "Pantalla completa";
      btn.setAttribute("aria-label", btn.title);
    });
  })();
</script>

<div id="cuerpo">
<aside id="barra">
  <button class="boton principal" id="nuevaChat" type="button">+ Nueva conversación</button>
  <h3>Conversaciones</h3>
  <div id="listaChats"></div>
</aside>
<section id="principal">
<div id="login-container">
  <div class="login-robot robot">
    <div class="auricular"></div>
    <div class="pantalla"></div>
    <div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div>
  </div>

const TITULO_BASE = "Nueva conversación";

function claveChats() { return "eloboth_chats_" + usuarioActual; }

function guardarChats() {
  try {
    almacen.setItem(claveChats(), JSON.stringify(estado));

  }

function nuevoId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function chatActual() {
  return estado.chats.find((c) => c.id === estado.activo);
}

function cargarChats() {
  try {
    estado = JSON.parse(almacen.getItem(claveChats())) || { activo: null, chats: [] };
  } catch (e) {
    estado = { activo: null, chats: [] };
  }
  if (!Array.isArray(estado.chats)) estado.chats = [];
  if (estado.chats.length === 0) {
    estado.chats.push({ id: nuevoId(), titulo: TITULO_BASE, mensajes: [] });
  }
  if (!estado.chats.some((c) => c.id === estado.activo)) {
    estado.activo = estado.chats[0].id;
  }
  guardarChats();
}

function renderizarBarra() {
  listaChats.innerHTML = "";
  for (const c of estado.chats) {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === estado.activo ? " activo" : "");
    const titulo = document.createElement("span");
    titulo.className = "titulo";
    titulo.textContent = c.titulo;
    const borrar = document.createElement("button");
    borrar.className = "borrar";
    borrar.type = "button";
    borrar.title = "Eliminar conversación";
    borrar.textContent = "✕";
    borrar.onclick = (e) => {
      e.stopPropagation();
      eliminarChat(c.id);
    };
    item.append(titulo, borrar);
    item.onclick = () => cambiarChat(c.id);
    listaChats.appendChild(item);
  }
}

function renderizarMensajes() {
  mensajes.innerHTML = "";
  const c = chatActual();
  if (c) c.mensajes.forEach((m) => pintarMensaje(m.texto, m.clase));
  chatSection.scrollTop = chatSection.scrollHeight;
}

function cambiarChat(id) {
  estado.activo = id;
  guardarChats();
  renderizarBarra();
  renderizarMensajes();
}

function crearChat() {
  const chat = { id: nuevoId(), titulo: TITULO_BASE, mensajes: [] };
  estado.chats.unshift(chat);
  cambiarChat(chat.id);
  texto.focus();
}

function eliminarChat(id) {
  const idx = estado.chats.findIndex((c) => c.id === id);
  if (idx === -1) return;
  estado.chats.splice(idx, 1);
  if (estado.chats.length === 0) {
    estado.chats.push({ id: nuevoId(), titulo: TITULO_BASE, mensajes: [] });
  }
  if (estado.activo === id) estado.activo = estado.chats[0].id;
  guardarChats();
  renderizarBarra();
  renderizarMensajes();
}

function agregarMensaje(textoMsj, clase) {
  const transitorio = clase.includes("pensando");
  const fila = pintarMensaje(textoMsj, clase);

    const c = chatActual();
    if (c) {

        c.titulo = textoMsj.slice(0, 32) + (textoMsj.length > 32 ? "…" : "");

      c.mensajes.push({ texto: textoMsj, clase });
      guardarChats();
      renderizarBarra();
    }
  }
  return fila;
}

function pintarMensaje(textoMsj, clase) {
  const fila = document.createElement("div");
  fila.className = "fila-msg " + (clase === "usuario" ? "usuario" : "");
  if (clase !== "usuario") fila.insertAdjacentHTML("beforeend", MINI_ROBOT);

  div.className = "msg " + clase;
  if (clase.includes("svg")) {
    div.innerHTML = textoMsj; // solo dibujos predefinidos del código
  } else {
    div.textContent = textoMsj;
  }
  fila.appendChild(div);

  // Botón para copiar la respuesta de Eloboth (no aparece en los mensajes del usuario ni en dibujos)
  if (clase !== "usuario" && !clase.includes("svg") && !clase.includes("pensando")) {
    const copiar = document.createElement("button");
    copiar.type = "button";
    copiar.className = "copiar";
    copiar.textContent = "📋 Copiar";
    copiar.onclick = async () => {
      try {
        await navigator.clipboard.writeText(textoMsj);
        copiar.textContent = "✅ Copiado";
      } catch (e) {
        copiar.textContent = "No se pudo copiar";
      }
      setTimeout(() => { copiar.textContent = "📋 Copiar"; }, 1500);
    };
    div.appendChild(copiar);
  }

  // Si el mensaje trae un bloque HTML, se puede ejecutar aislado en un marco dentro de la página
  const bloqueHtml = !clase.includes("svg") && textoMsj.match(/```html\n([\s\S]*?)\n```/);
  if (bloqueHtml) {
    const contenedor = document.createElement("div");
    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "boton";
    boton.style.marginTop = "10px";
    boton.textContent = "▶ Ejecutar en esta página";
    boton.onclick = () => {
      if (contenedor.firstChild) {
        contenedor.innerHTML = "";
        boton.textContent = "▶ Ejecutar en esta página";
      } else {
        const marco = document.createElement("iframe");
        marco.setAttribute("sandbox", "allow-scripts");
        marco.srcdoc = bloqueHtml[1];
        marco.style.cssText = "width:100%;height:360px;border:1px solid var(--borde);border-radius:12px;margin-top:10px;background:#fff;";
        contenedor.appendChild(marco);
        boton.textContent = "✖ Ocultar";
      }
    };
    div.appendChild(boton);
    div.appendChild(contenedor);
  }
  mensajes.appendChild(fila);
  chatSection.scrollTop = chatSection.scrollHeight;
  return fila;
}

function normalizarTexto(str) {
  return str
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, "")
    .trim();
}

function tokenizarPalabras(str) {
  const norm = normalizarTexto(str);
  return norm ? norm.split(/\s+/) : [];
}


async function buscarMemoriaAprendida(termino) {
  const mapa = await cargarMemoriaMapa();
  return mapa.get(normalizarTexto(termino)) || null;
}

async function buscarMemoriaAntigua(termino) {
  if (!db) return null;
  try {
    const querySnapshot = await getDocs(collection(db, "eloboth_aprendizajes"));
    const busquedaNorm = normalizarTexto(termino);
    for (const docSnap of querySnapshot.docs) {
      const data = docSnap.data();
      if (data.palabra && normalizarTexto(data.palabra) === busquedaNorm) {
        return data.definicion;
      }
    }
  } catch (err) {
    console.error("Error al consultar la memoria de Firestore:", err);
  }
  return null;
}

async function guardarAprendizajeFirestore(palabra, definicion) {
  if (!db) {
    console.error("La base de datos Firestore no está inicializada.");
    return { ok: false, error: "Base de datos no disponible." };
  }
  try {
    await addDoc(collection(db, "eloboth_aprendizajes"), {
      palabra: palabra.trim(),
      palabraNorm: normalizarTexto(palabra),
      definicion: definicion.trim(),
      usuario: usuarioActual || "Anónimo",
      fecha: new Date().toISOString()
    });
    if (memoriaCache) memoriaCache.set(normalizarTexto(palabra), definicion.trim());
    return { ok: true };
  } catch (err) {
    console.error("Error al escribir en Firestore:", err);
    return { ok: false, error: err.message };
  }
}

function generarListaMasivaOraciones(palabra) {
  const patrones = [
    `El concepto de ${palabra} es esencial en el análisis contemporáneo.`,
    `A través de ${palabra}, logramos estructurar ideas de manera clara y precisa.`,
    `¿Cómo influye ${palabra} en el desarrollo de nuestras tareas cotidianas?`,
    `Al aplicar ${palabra} correctamente, se optimizan los resultados deseados.`,
    `El estudio profundo sobre ${palabra} permite comprender mejor su contexto.`,
    `Integrar ${palabra} fortalece la consistencia del mensaje formulado.`,
    `Cada aspecto relacionado con ${palabra} aporta un valor significativo al conjunto.`,
    `La correcta interpretación de ${palabra} evita confusiones en la comunicación.`
  ];

  let resultado = `📄 Generación masiva de 1,000 oraciones para "${palabra}":\n\n`;
  for (let i = 1; i <= 1000; i++) {
    const patron = patrones[(i - 1) % patrones.length];
    resultado += `${i}. ${patron} (Variación #${i})\n`;
  }
  return resultado;
}

const PERSONAS = ["yo", "tú", "él/ella", "nosotros", "vosotros", "ellos"];
const TIEMPOS = {
  pres: "presente de indicativo",
  pret: "pretérito indefinido",
  imp: "pretérito imperfecto",
  fut: "futuro simple",
  cond: "condicional simple"
};
const TERM_FUT = ["é", "ás", "á", "emos", "éis", "án"];
const TERM_COND = ["ía", "ías", "ía", "íamos", "íais", "ían"];
const TERM_IMP_AR = ["aba", "abas", "aba", "ábamos", "abais", "aban"];

function construirIndiceConjugaciones() {
  const indice = new Map();
  const agregar = (forma, verbo, tiempo, i) => {
    const k = normalizarTexto(forma);
    if (!indice.has(k)) indice.set(k, []);
    indice.get(k).push({ verbo, tiempo, persona: PERSONAS[i] });
  };

  for (const [verbo, d] of Object.entries(CONJUGACIONES)) {
    const raizBase = verbo.slice(0, -2);
    const raizFut = d.fut || verbo;
    const formas = {
      pres: d.pres.split(" "),
      pret: d.pret.split(" "),
      imp: d.imp
        ? d.imp.split(" ")
        : (verbo.endsWith("ar") ? TERM_IMP_AR : ["ía", "ías", "ía", "íamos", "íais", "ían"]).map((t) => raizBase + t),
      fut: TERM_FUT.map((t) => raizFut + t),
      cond: TERM_COND.map((t) => raizFut + t)
    };
    for (const tiempo of Object.keys(formas)) {
      formas[tiempo].forEach((forma, i) => agregar(forma, verbo, tiempo, i));
    }
  }
  return indice;
}

const INDICE_CONJ = construirIndiceConjugaciones();

// ---------- Interpretación palabra por palabra ----------
// La memoria se lee de Firestore una sola vez por sesión y después se consulta en local
let memoriaCache = null;
async function cargarMemoriaMapa() {
  if (memoriaCache) return memoriaCache;
  const mapa = new Map();
  memoriaCache = mapa;
  if (!db) return mapa;
  try {
    const snap = await getDocs(collection(db, "eloboth_aprendizajes"));
    snap.docs.forEach((d) => {
      const data = d.data();
      if (data.palabra) mapa.set(normalizarTexto(data.palabra), data.definicion);
    });
  } catch (err) {
    console.error("Error al cargar la memoria:", err);
    memoriaCache = null;
  }
  return mapa;
}

function significadosDePalabra(palabra, memoria) {
  const out = [];
  if (memoria.has(palabra)) {
    out.push({ fuente: "memoria", texto: memoria.get(palabra) });
  }
  const hits = INDICE_CONJ.get(palabra);
  if (hits) {
    out.push({
      fuente: "conjugación",
      texto: hits.map((h) => `${TIEMPOS[h.tiempo]}, ${h.persona} de ${h.verbo}`).join("; ")
    });
  }
  return out;
}

async function interpretarOracion(msgOriginal) {
  const palabrasOriginales = msgOriginal.split(/\s+/).filter(Boolean);
  const memoria = await cargarMemoriaMapa();
  const conocidas = [];
  const desconocidas = [];

  for (const original of palabrasOriginales) {
    const norm = normalizarTexto(original);
    if (!norm) continue;
    const sig = significadosDePalabra(norm, memoria);

  const PALABRAS_INTERROGATIVAS = ["que", "quien", "quienes", "cual", "cuales", "como", "donde", "adonde", "cuando", "cuanto", "cuanta", "cuantos", "cuantas", "por", "para"];

  resp += `\n\n🔗 Significado combinado: ${combinado}`;
  resp += `\n\n🧭 Contexto: ${contexto}`;
  if (desconocidas.length) {

// Toma la última frase de palabras desconocidas, que suele ser el tema de la pregunta
function temaDesconocido(palabras, memoria) {
  const tema = [];

async function buscarSinonimos(palabra) {

async function buscarWikcionario(palabra) {

  if (!p || /\s/.test(p)) return null;

function limpiarWikcionario(t) {
  return t
    .replace(/\{\{[^{}]*\}\}/g, "")
    .replace(/\[\[(?:[^|\]]*\|)?([^\]]*)\]\]/g, "$1")
    .replace(/'{2,}/g, "")
    .replace(/<[^>]+>/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function extraerDefinicionesWikcionario(wikitext, palabra) {
  let enEspanol = false;
  let categoria = "";
  const salida = [];
  for (const linea of wikitext.split("\n")) {
    const nivel2 = linea.match(/^==\s*([^=].*?)\s*==\s*$/);
    if (nivel2) {
      if (salida.length) break;
      enEspanol = /lengua\|es|español/i.test(nivel2[1]);
      categoria = "";
      continue;
    }
    if (!enEspanol) continue;
    const nivel3 = linea.match(/^===\s*(.*?)\s*===\s*$/);
    if (nivel3) {
      categoria = nivel3[1].replace(/\{\{|\}\}/g, "").replace(/\|es/g, "").trim();
      continue;
    }
    const def = linea.match(/^#\s+(?![:*#])(.+)$/);
    if (def) {
      const texto = limpiarWikcionario(def[1]);
      if (texto) salida.push(categoria ? `(${categoria}) ${texto}` : texto);
      if (salida.length >= 3) break;
    }
  }
  return salida.length ? `📖 ${palabra}:\n${salida.join("\n")}` : null;
}

const SECCIONES_OMITIDAS = /^(referencias|enlaces externos|v[ée]ase tambi[ée]n|bibliograf[ií]a|notas|fuentes|ver tambi[ée]n)/i;

function armarRespuestaCompleta(titulo, textoCompleto) {
  const partes = textoCompleto.split(/\n==+\s*(.+?)\s*==+\n/);
  // partes[0] = introducción; luego pares [titulo de sección, contenido]
  const intro = partes[0].replace(/\s+/g, " ").trim();
  if (!intro) return null;
  const introFrases = intro.split(/(?<=\.)\s+/).slice(0, 4).join(" ");
  const destacados = [];
  for (let i = 1; i < partes.length - 1 && destacados.length < 4; i += 2) {
    const nombre = partes[i].trim();
    if (SECCIONES_OMITIDAS.test(nombre)) continue;
    const contenido = partes[i + 1].replace(/\s+/g, " ").trim();
    if (!contenido) continue;
    const frases = contenido.split(/(?<=\.)\s+/).slice(0, 2).join(" ");
    destacados.push(`• ${nombre}: ${frases}`);
  }
  const bloques = [`📖 ${titulo}\n${introFrases}`];
  if (destacados.length) bloques.push(`Aspectos destacados:\n${destacados.join("\n")}`);
  return bloques.join("\n\n");
}

}

// Traducción de inglés a español (MyMemory: gratis, sin clave)
async function traducirIngles(texto) {
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=en|es`);
  if (!r.ok) return null;
  const datos = await r.json();
  const trad = datos?.responseData?.translatedText;
  if (!trad || trad.toLowerCase() === texto.toLowerCase()) return null;
  return trad;
}

// Si el mensaje está en inglés (una palabra o una frase corta), lo traduce
async function respuestaIngles(msgOriginal) {
  const sinPrefijo = normalizarTexto(msgOriginal)
    .replace(/^(que significa|que quiere decir|traduce|traduceme|como se dice|significa)\s+/, "")
    .trim();
  const partes = sinPrefijo.split(/\s+/).filter(Boolean);
  if (!partes.length || partes.length > 6) return null;
  const enIngles = partes.filter((p) => PALABRAS_INGLES.has(p)).length;
  if (enIngles === 0 || enIngles < Math.ceil(partes.length / 2)) return null;
  const trad = await traducirIngles(sinPrefijo);
  return trad ? `"${sinPrefijo}" en inglés significa "${trad}".` : `No pude traducir "${sinPrefijo}".`;
}

// Traduce un texto largo de inglés a español (lo parte en trozos para el límite del servicio)
async function traducirTexto(texto) {
  const frases = texto.split(/(?<=[.!?])\s+/);
  const trozos = [];
  let actual = "";
  for (const f of frases) {
    if ((actual + " " + f).length > 400) { if (actual) trozos.push(actual); actual = f; }
    else actual = actual ? actual + " " + f : f;
  }
  if (actual) trozos.push(actual);
  const partes = [];
  for (const t of trozos) {
    const trad = await traducirIngles(t);
    partes.push(trad || t);
  }
  return partes.join(" ");
}

// Comandos: "traduce al español: ...", "cambia de inglés a español: ..."
async function respuestaTraducir(msgOriginal) {
  const m = msgOriginal.match(/^\s*(?:cambia(?:r)?|pasa(?:r)?|traduce|traducir|tradu[cz]e)\b[^:]*?\b(?:a|al)\s+espa[ñn]ol\s*[:,\-]?\s*([\s\S]*)$/i);
  if (!m) return null;
  const texto = m[1].trim();
  if (!texto) return "Pega el texto en inglés que quieres pasar a español.";
  const traduccion = await traducirTexto(texto);
  return `Traducción al español:\n\n${traduccion}`;
}

// Guía de estudio: busca lo que no conoce, une los significados y arma preguntas para repasar
async function guiaDeEstudio(textoOriginal) {
  const tema = textoOriginal
    .replace(/^\s*(?:quiero\s+)?(?:una?\s+)?gu[ií]a\s+de\s+estudios?\s*(?:sobre|de|para)?\s*/i, "")
    .trim();
  if (!tema) return "Dime sobre qué tema quieres la guía. Por ejemplo: guía de estudio sobre la fotosíntesis.";

  progreso("📚 Armando la guía de estudio...");
  await esperar(500);
  const palabras = tema.split(/\s+/)
    .map((p) => p.replace(/[^\p{L}]/gu, "").toLowerCase())
    .filter((p) => p && !PALABRAS_GUIA_VACIAS.has(normalizarTexto(p)));
  const unicas = [...new Set(palabras)].slice(0, 6);

  const conceptos = [];
  const noPudo = [];
  for (const p of unicas) {
    progreso(`🧠 Pensando qué significa "${p}"...`);
    await esperar(400);
    const guardado = await buscarMemoriaAprendida(p).catch(() => null);
    const significado = guardado || (await definirOSinonimo(p).catch(() => null));
    if (significado) {
      const limpio = significado.replace(/^📖[^:]*:\s*/, "").replace(/\s*\n\s*/g, " ").trim();
      conceptos.push(`• ${p}: ${limpio}`);
    } else {
      noPudo.push(p);
    }
  }

  progreso("🔗 Uniendo los significados...");
  await esperar(600);
  const intro = await introWikipedia(tema).catch(() => null);
  const resumen = intro ? intro.texto.split(/(?<=\.)\s+/).slice(0, 3).join(" ") : null;

  if (!conceptos.length && !resumen) {
    return `No lo pude hacer: no encontré información sobre "${tema}".`;
  }
  const partes = [`📚 Guía de estudio: ${tema}`];
  if (resumen) partes.push(`Resumen: ${resumen}`);
  if (conceptos.length) partes.push(`Conceptos clave:\n${conceptos.join("\n")}`);
  if (noPudo.length) partes.push(`No lo pude hacer con: ${noPudo.join(", ")}.`);
  const base = unicas[0] || tema;
  partes.push(`Preguntas para repasar:\n1. ¿Cómo se relaciona ${tema} con ${base}?\n2. ¿Qué diferencia hay entre ${tema} y un concepto parecido?\n3. ¿Dónde se ve ${tema} en la vida diaria?`);
  return partes.join("\n\n");
}

// ---- Extraer de un texto solo lo que responde a la pregunta ----
const STOP_RESPUESTA = new Set(["que","quien","quienes","cuando","cuanto","cuanta","cuantos","cuantas","donde","como","cual","cuales","por","para","de","del","la","el","los","las","un","una","unos","unas","en","y","o","a","al","es","son","fue","fueron","era","eran","se","su","sus","con","sobre","ser","hay","hubo","significa","significan","hizo","pasa","paso"]);

function tipoDePregunta(pregunta) {
  const n = normalizarTexto(pregunta);
  if (/^cuando\b/.test(n)) return "cuando";
  if (/^(quien|quienes)\b/.test(n)) return "quien";
  if (/^donde\b/.test(n)) return "donde";
  if (/^(cuanto|cuanta|cuantos|cuantas)\b/.test(n)) return "cuanto";
  return "que";
}

// Palabras clave de la pregunta; se comparan por el inicio de la palabra para aceptar plurales y variantes
function clavesDePregunta(pregunta) {
  return normalizarTexto(pregunta).split(" ")
    .filter((w) => w.length >= 3 && !STOP_RESPUESTA.has(w))
    .map((w) => w.slice(0, 5));
}

// Bonus según el tipo de pregunta: años para "cuándo", números para "cuánto", definiciones para "qué es"
function bonusPorTipo(oracion, tipo) {
  const n = normalizarTexto(oracion);
  if (tipo === "cuando") return (/\b(1\d{3}|20\d{2})\b/.test(n) ? 2 : 0) + (/\bsiglos?\b/.test(n) ? 1 : 0);
  if (tipo === "cuanto") return /\d/.test(n) ? 2 : 0;
  if (tipo === "quien") return /\b(fue|es|era|son)\b/.test(n) ? 1 : 0;
  if (tipo === "donde") return /\b(en|ubicad[oa]|situad[oa]|localizad[oa])\b/.test(n) ? 1 : 0;
  return /\b(es|son|consiste|define|refiere)\b/.test(n) ? 1 : 0;
}

// Devuelve como máximo 3 oraciones importantes que responden a la pregunta, en su orden original
const MAX_ORACIONES_RESPUESTA = 3;
function tieneNumero(oracion) {
  const n = normalizarTexto(oracion);
  return /\d/.test(n) || /\bsiglo\s+[ivxlc]+\b/.test(n);
}

function extraerRespuesta(texto, pregunta) {
  if (!texto) return null;
  const oraciones = texto.replace(/\s+/g, " ").trim().split(/(?<=[.!?])\s+/).filter((o) => o.length > 15);
  const claves = clavesDePregunta(pregunta);
  const tipo = tipoDePregunta(pregunta);
  const puntuadas = oraciones.map((o, idx) => {
    const palabras = normalizarTexto(o).split(" ");
    const coincidencias = claves.filter((c) => palabras.some((w) => w.startsWith(c))).length;
    const n = normalizarTexto(o);
    const tiempo = /(comenz|termin|inici|finaliz|desde|hasta|entre|durante|ocurri)/.test(n);
    const fechaTemporal = tipo === "cuando" && /\b\d{3,4}\b/.test(n) && tiempo;
    return { o, idx, coincidencias, tiempo, score: coincidencias * 2 + bonusPorTipo(o, tipo) + (fechaTemporal ? 6 : 0) };
  });
  let candidatas;
  if (tipo === "cuando") {
    // "cuándo": solo oraciones con números (años o siglos)
    candidatas = puntuadas.filter((x) => tieneNumero(x.o) && (x.coincidencias >= 1 || x.tiempo));
  } else {
    candidatas = puntuadas.filter((x) => x.coincidencias >= 1 || claves.length === 0);
  }
  if (!candidatas.length) return null;
  const elegidas = candidatas
    .sort((a, b) => b.score - a.score || a.idx - b.idx)
    .slice(0, MAX_ORACIONES_RESPUESTA)
    .sort((a, b) => a.idx - b.idx);
  return elegidas.map((x) => x.o.slice(0, 400)).join(" ");
}

// Google (Custom Search API): busca la pregunta y extrae de los resultados lo que responde
// Necesita GOOGLE_API_KEY y GOOGLE_CX arriba en el archivo; si están vacíos, no se usa
async function respuestaDeGoogle(pregunta) {
  if (!GOOGLE_API_KEY || !GOOGLE_CX) return null;
  const url = `https://www.googleapis.com/customsearch/v1?key=${encodeURIComponent(GOOGLE_API_KEY)}&cx=${encodeURIComponent(GOOGLE_CX)}&num=5&hl=es&lr=lang_es&q=${encodeURIComponent(pregunta)}`;
  const r = await fetch(url);
  if (!r.ok) return null;
  const items = (await r.json())?.items || [];
  if (!items.length) return null;
  const textos = items
    .map((i) => (i.snippet || "").replace(/\s+/g, " ").replace(/[.…\s]+$/, "") + ".")
    .join(" ");
  const extraido = extraerRespuesta(textos, pregunta);
  return extraido ? `🔎 Google: ${extraido}` : null;
}

// Worker: Brave busca la pregunta; el worker devuelve el resumen con IA de Brave o el texto del primer resultado, y Eloboth extrae lo que responde
async function buscarEnWorker(pregunta) {
  const senal = typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(30000) : undefined;
  const r = await fetch(`${WORKER_URL}/?q=${encodeURIComponent(pregunta)}`, { signal: senal });
  if (!r.ok) return null;
  const d = await r.json();
  return d && (d.resumen || d.texto) ? d : null;
}

// Charla: el worker responde cualquier frase como persona (necesita la clave de OpenRouter en el worker)
async function respuestaDeChat(texto) {
  const senal = typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(30000) : undefined;
  const r = await fetch(`${WORKER_URL}/?chat=1&q=${encodeURIComponent(texto)}`, { signal: senal });
  if (!r.ok) return null;
  const d = await r.json();
  return d && d.resumen ? d.resumen : null;
}

// Texto de la página del primer resultado de Brave: solo las oraciones que responden a la pregunta
function respuestaDeTexto(d, pregunta) {
  if (!d || !d.texto) return null;
  const extraido = extraerRespuesta(d.texto, pregunta);
  if (!extraido) return null;
  // Del título se quita el nombre del sitio ("Edad Media - Wikipedia..." -> "Edad Media")
  const titulo = (d.titulo || "").split(/\s[-|–]\s/)[0].trim();
  return titulo ? `🔎 ${titulo}: ${extraido}` : `🔎 ${extraido}`;
}

// Wikipedia: busca la pregunta (y luego el tema) y extrae de su artículo lo que responde
async function respuestaDeWikipedia(pregunta, tema) {
  for (const consulta of [pregunta, tema]) {
    const rb = await fetch(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(consulta)}&srlimit=1&format=json&origin=*`);
    if (!rb.ok) continue;
    const titulo = ((await rb.json())?.query?.search || [])[0]?.title;
    if (!titulo) continue;
    const r = await fetch(`https://es.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&redirects=1&titles=${encodeURIComponent(titulo)}&format=json&origin=*`);
    if (!r.ok) continue;
    const pagina = Object.values((await r.json())?.query?.pages || {})[0];
    if (!pagina || !pagina.extract) continue;
    // Los títulos de sección ("== Premios ==") se vuelven pausas entre oraciones
    const texto = pagina.extract.replace(/={2,}[^=\n]+={2,}/g, ". ").slice(0, 60000);
    const extraido = extraerRespuesta(texto, pregunta);
    if (extraido) return `📖 ${pagina.title}\n${extraido}`;
  }
  return null;
}

// DuckDuckGo: lee el resumen y extrae lo que responde a la pregunta
async function respuestaDeDuckDuckGo(pregunta) {
  const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(pregunta)}&format=json&no_html=1&skip_disambig=1`);
  if (!r.ok) return null;
  const d = await r.json();
  if (!d.AbstractText) return null;
  const extraido = extraerRespuesta(d.AbstractText, pregunta);
  return extraido ? `🔎 ${extraido}` : null;
}

// ---- Preguntas sobre un tema ----
const PALABRAS_TEMA_VACIAS = new Set(["de","la","el","los","las","un","una","en","y","o","a","del","al","que","por","para","sobre","con","se","es","son","fue","fueron","era","eran","cuando","cual","cuales","donde","como","quien","quienes","cuanto","cuanta","cuantos","cuantas","su","sus","hay","entre","hubo","hasta","desde","relaciona","relacionan","relacion","diferencia","diferencias","hace","hacen","pasa","pasan","tiene","tienen","existe","significa","significan","ser","estar","uso","vida","diaria","dije","dijo","dime","di"]);

function esPreguntaTema(msgOriginal, norm) {
  if (norm === "que es eso") return false;
  const pideTema = /^(dime|cuentame|explicame|quiero saber|hablame)\b/.test(norm);
  const empiezaConPregunta = pideTema || /^(que|quien|quienes|cuando|cuanto|cuanta|cuantos|cuantas|donde|como|cual|cuales|por que|para que|de que|a que)\b/.test(norm);
  const pocasPalabras = norm.split(" ").length <= 4 && msgOriginal.includes("?");
  return empiezaConPregunta || pocasPalabras;
}

// Quita las palabras de pregunta y deja el tema ("cuándo fue la edad media" -> "edad media")
function extraerTema(texto) {
  return texto
    .replace(/[?¿!¡]/g, "")
    .trim()
    .replace(/^(qu[eé]|qui[eé]n(?:es)?|cu[aá]ndo|cu[aá]nt[oa]s?|d[oó]nde|c[oó]mo|cu[aá]l(?:es)?|por qu[eé]|para qu[eé]|de qu[eé]|a qu[eé])\s+/i, "")
    .replace(/^(es|son|fue|fueron|era|eran|significa|significan|sirve|hace|hizo|pasó|pasa|ocurri[oó])\s+/i, "")
    .replace(/^(dime|cu[eé]ntame|expl[ií]came|h[aá]blame|quiero saber)\s+(todo\s+)?(sobre\s+|de\s+)?/i, "")
    .replace(/^todo\s+(sobre\s+|de\s+)?/i, "")
    .replace(/^(el|la|los|las|un|una)\s+/i, "")
    .trim();
}

// 1) Brave: si da resumen con IA, esa es la respuesta  2) Significado de palabras  3) Brave (texto), DuckDuckGo y Wikipedia
async function responderPregunta(msgOriginal) {
  // Se quitan "dije", "dime" y similares al final: no son parte del tema
  msgOriginal = msgOriginal.replace(/\s+(dije|dijiste|dime|di)\s*$/i, "").trim();
  const tema = extraerTema(msgOriginal);
  if (!tema) return "¿Sobre qué quieres saber?";
  const palabras = tema.split(/\s+/)
    .map((p) => p.replace(/[^\p{L}]/gu, "").toLowerCase())
    .filter((p) => p && !PALABRAS_TEMA_VACIAS.has(normalizarTexto(p)));

  const preguntaExacta = msgOriginal.replace(/[?¿!¡]/g, "").trim();

  // Si es una sola palabra que ya sé, respondo directo
  if (!/\s/.test(tema)) {
    const guardado = await buscarMemoriaAprendida(tema).catch(() => null);
    if (guardado) return `${tema} es ${guardado}`;
  }

  // Primero la IA del worker (entiende la pregunta completa). Si no responde, sigue lo de siempre
  const charlaPregunta = await respuestaDeChat(preguntaExacta).catch(() => null);
  if (charlaPregunta) return charlaPregunta;

  // Primero: Brave. Si muestra su resumen con IA, esa es la única respuesta
  progreso(`🔎 Buscando "${preguntaExacta}"...`);
  const brave = await buscarEnWorker(preguntaExacta).catch(() => null);
  if (brave && brave.resumen) return brave.resumen;

  // Después: significado de las palabras, solo si piden un significado o es una sola palabra
  const pideSignificado = /signific/.test(normalizarTexto(msgOriginal)) || palabras.length === 1;
  const significados = [];
  for (const p of pideSignificado ? [...new Set(palabras)].slice(0, 5) : []) {
    const guardado = await buscarMemoriaAprendida(p).catch(() => null);
    if (guardado) continue;
    progreso(`🧠 Buscando el significado de "${p}"...`);
    const def = await definirOSinonimo(p).catch(() => null);
    if (def) significados.push(`• ${p}: ${def.replace(/^📖[^:]*:\s*/, "").replace(/\s*\n\s*/g, " ").trim()}`);
  }

  // Sin resumen de IA: texto de la página de Brave, DuckDuckGo y Wikipedia
  let respuesta = await respuestaDeGoogle(preguntaExacta).catch(() => null);
  if (!respuesta) respuesta = respuestaDeTexto(brave, preguntaExacta);
  if (!respuesta) respuesta = await respuestaDeDuckDuckGo(preguntaExacta).catch(() => null);
  if (!respuesta) respuesta = await respuestaDeWikipedia(preguntaExacta, tema).catch(() => null);
  if (!respuesta) respuesta = await buscarWikidata(tema).catch(() => null);

  if (!respuesta) {
    const dato = `No encontré una respuesta sobre "${tema}". Puedes enseñármela: Aprende que ${tema} significa ...`;
    return significados.length ? `${significados.join("\n")}\n\n${dato}` : dato;
  }
  const bloques = [];
  if (significados.length) bloques.push(`Significado de palabras:\n${significados.join("\n")}`);
  bloques.push(respuesta);
  return bloques.join("\n\n");
}

async function procesarComando(msgOriginal) {
  const norm = normalizarTexto(msgOriginal);
  const palabras = tokenizarPalabras(msgOriginal);

  // 1. Saludo estricto
  if (norm === "hola") {
    return "¡Hola!";
  }

  // 1a-corr. Corrección: "te equivocaste", "no puede ser", "eso está mal"... vuelve a responder la pregunta anterior
  // Solo es corrección si va dirigida a Eloboth ("te equivocaste") o es una frase corta que corrige algo.
  // "me equivoqué", "se equivocó", "no te equivocaste" no cuentan.
  const negacionOTercera = /\b(no te equivoc\w*|me equivoc\w*|se equivoc\w*|equivocarse)\b/.test(norm);
  const correccionFuerte = /\b(te equivoc\w*|erraste|erras)\b/.test(norm) && !/\bno te equivoc/.test(norm);
  const correccionSuave = /\b(estas mal|eso esta mal|no puede ser|incorrecto|no es asi)\b/.test(norm) && norm.split(" ").length <= 8;
  if (!negacionOTercera && (correccionFuerte || correccionSuave)) {
    const c = chatActual();
    const previas = c ? c.mensajes.filter((m) => m.clase === "usuario") : [];
    const anterior = previas.length >= 2 ? previas[previas.length - 2].texto : null;
    if (anterior) {
      progreso("🔄 Revisando mi respuesta anterior...");
      const corregida = await respuestaDeChat(
        `Mi pregunta fue: "${anterior}". Tu respuesta anterior estuvo mal. Discúlpate brevemente, corrige y responde bien con datos correctos y en tono natural.`
      ).catch(() => null);
      if (corregida) return corregida;
    }
    return "Tienes razón, me equivoqué. Dime otra vez la pregunta, o dime qué parte está mal, y lo intento de nuevo.";
  }

  // 1b. Respuesta a la oferta de buscar
  if (busquedaPendiente) {
    const tema = busquedaPendiente;
    busquedaPendiente = null;
    if (/^(si|sip|claro|dale|busca|buscalo|buscala|ok|okay|por favor)\b/.test(norm)) {
      return await buscarEnRedes(tema);
    }
    if (/^(no|nop|no gracias|mejor no)\b/.test(norm)) {
      return "Está bien. Si quieres, pregúntame otra cosa.";
    }
  }

  // 1a-0. Muletillas al inicio ("okey me gusta, hace un html"): se quitan y se sigue con la orden
  const mMuletilla = msgOriginal.match(/^\s*(?:ok(?:ey|ay)?|vale|dale|bien|s[ií]|genial|perfecto|me gusta|me encanta|buen[ií]simo)\b[\s,.!¡-]*(?:me gusta\b[\s,.!¡-]*)?(?:me (?:dijo|dijiste|pidio|pidió) que\s+)?(?:le\s+)?([\s\S]*)$/i);
  if (mMuletilla && mMuletilla[1] && /\bhtml\b/i.test(mMuletilla[1])) {
    return await procesarComando(mMuletilla[1].trim());
  }

  // 1a-html. Respuesta a "¿qué debe tener el HTML?"
  if (htmlPendiente) {
    htmlPendiente = false;
    return await procesarComando("escribe html " + msgOriginal);
  }

  // 1a. Cambiar de "modelo" (solo cambia la etiqueta que muestra Eloboth)
  const mModelo = msgOriginal.match(/^\s*(?:cambia|cambiar|cambiame|pon|pone|usa|usar)\s+(?:el\s+)?modelo(?:\s+a|\s+por)?\s*(.*)$/i);
  if (mModelo) {
    const nuevo = mModelo[1].trim();
    if (!nuevo) {
      return `Mi modelo actual es ${modeloActual}. Puedo cambiar a: Eloboth Bajo, Eloboth Medio o Eloboth Alto. Dime cuál quieres.`;
    }
    modeloActual = nuevo.replace(/\b\w/g, (c) => c.toUpperCase());
    return `Listo, cambié mi modelo a ${modeloActual}. Ahora respondo con ese modelo.`;
  }
  if (/^(que|cual) modelo (usas|eres|tienes)\b/.test(norm)) {
    return `Estoy usando ${modeloActual}.`;
  }

  // 1c. Crear cuadro comparativo o cuento (sin buscar en internet)
  if (modoCreacion === "cuadro") {
    modoCreacion = null;
    return (await construirCuadro(msgOriginal)) ||
      "No entendí qué comparar. Escribe algo como: perro y gato sobre animales de casa.";
  }
  if (/^crear cuadro\b/.test(norm)) {
    const resto = msgOriginal.replace(/^\s*crear\s+cuadro(\s+comparativo)?/i, "").trim();
    if (!resto) {
      modoCreacion = "cuadro";
      return "¿Qué quieres comparar y sobre qué? Por ejemplo: perro y gato sobre animales de casa.";
    }

  if (/^crear cuento\b/.test(norm)) {

  // 2. Aprendizaje ("Aprende que X significa Y"), una por línea

    if (!clave && palabras.includes("link")) clave = "enlace";
    // Sin descripción de lo que debe tener: se pregunta antes de crearlo
    const relleno = new Set(["html","hace","hacer","hagame","haga","haz","hazme","crea","crear","cree","genera","genere","generar","escribe","escriba","escribir","dame","quiero","quieres","puedes","un","una","unos","unas","el","la","me","por","favor","pagina","página","de","para"]);
    const resto = palabras.filter((p) => !relleno.has(p) && !relleno.has(normalizarTexto(p)));
    if (!clave && resto.length === 0) {
      htmlPendiente = true;
      return "¿Qué quieres que tenga el HTML? Por ejemplo: un botón, un formulario, una tabla, una lista o una página sobre un tema.";
    }
    if (!clave) clave = "pagina";
    const nombre = clave === "pagina" ? "una página" : clave;
    return `Aquí tienes HTML de ${nombre}:\n\`\`\`html\n${clave === "pagina" ? generarPaginaHtml(msgOriginal) : PLANTILLAS_HTML[clave]}\n\`\`\``;
  }

  // 5. Generador de código "print"
  if (palabras.includes("print") || palabras.includes("imprimir") || palabras.includes("muestra")) {
    if (palabras.includes("html")) return `Estructura HTML:\n\`\`\`html\n<h1>¡Hola!</h1>\n\`\`\``;
    if (palabras.includes("javascript") || palabras.includes("js")) return `Código JavaScript:\n\`\`\`javascript\nconsole.log("¡Hola!");\n\`\`\``;
    if (palabras.includes("lua")) return `Script Lua:\n\`\`\`lua\nprint("¡Hola!")\n\`\`\``;
    if (palabras.includes("c") || palabras.includes("cpp")) return `Código C++:\n\`\`\`cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << "¡Hola!" << endl;\n    return 0;\n}\n\`\`\``;
  }

  // 6. Consulta en memoria de Firestore (oración completa o palabras clave)
  const memoriaOracion = await buscarMemoriaAprendida(msgOriginal);
  if (memoriaOracion) return `💡 Definición aprendida:\n"${memoriaOracion}"`;

  // Solo para una palabra; en oraciones lo maneja el análisis completo (paso 8)
  for (const p of palabras.length === 1 ? palabras : []) {
    if (p.length > 2) {
      const memoriaPalabra = await buscarMemoriaAprendida(p);
      if (memoriaPalabra) {
        return `💡 Sobre "${p}" tengo registrado:\n"${memoriaPalabra}"`;
      }
    }
  }

  // 6b. Conjugación de una sola palabra (no interfiere con frases)
  if (palabras.length === 1) {
    const hits = INDICE_CONJ.get(palabras[0]);
    if (hits) {
      const lista = hits.map((h) => `${TIEMPOS[h.tiempo]}, ${h.persona} de ${h.verbo}`);
      return `🔤 "${msgOriginal.trim()}":\n${lista.join("\n")}`;
    }
  }

  // 7. Respuestas conversacionales
  if (norm === "que es eso" || (palabras.includes("que") && palabras.includes("es") && palabras.includes("eso"))) {
    return "Analizando tu consulta [Palabras: 'que', 'es', 'eso'] -> Es una expresión para solicitar la definición de un objeto o concepto. Si deseas enseñarme uno, escribe: 'Aprende que [palabra] significa [definición]'.";
  }
  if (norm === "como estas" || (palabras.includes("como") && palabras.includes("estas"))) {
    return `¡Todo excelente por aquí! ¿Y tú, ${usuarioActual}, cómo estás?`;
  }
  if (norm === "bien y tu" || (palabras.includes("bien") && palabras.includes("tu"))) {
    return "¡Me alegro mucho! Yo estoy genial, listo para ayudarte.";
  }
  if (palabras.includes("gracias")) {
    return `¡De nada, ${usuarioActual}! Es un gusto ayudar.`;
  }

  // 8. Interpretación de la oración con las palabras que conoce
  if (palabras.length > 1 || msgOriginal.includes("?")) {
    const interpretacion = await responderOracion(msgOriginal);
    if (interpretacion) return interpretacion;
  }

  return `Entendido. He analizado las ${palabras.length} palabras de tu mensaje ("${palabras.join('", "')}"). No tengo un registro guardado sobre esta consulta. Puedes enseñármelo escribiendo: "Aprende que ${msgOriginal} significa [tu definición]".`;
}

// ---------- Imágenes pegadas (Ctrl+V / Cmd+V) ----------
let imagenPendiente = null;
const previa = document.getElementById("previa");
const previaImg = document.getElementById("previaImg");

function limpiarImagen() {
  imagenPendiente = null;
  previa.hidden = true;
  previaImg.removeAttribute("src");
}
document.getElementById("quitarImg").onclick = limpiarImagen;

texto.addEventListener("paste", (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  const item = items.find((it) => it.type.startsWith("image/"));
  if (!item) return;
  const file = item.getAsFile();
  if (!file) return;
  e.preventDefault();

  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    const img = new Image();
    img.onload = () => {
      imagenPendiente = { url, ancho: img.naturalWidth, alto: img.naturalHeight, tipo: file.type };
      previaImg.src = url;
      previa.hidden = false;
      texto.focus();
    };
    img.src = url;
  };
  reader.readAsDataURL(file);
});

function agregarImagen(imagen, textoExtra = "") {
  const fila = agregarMensaje(textoExtra || "📷 Imagen pegada", "usuario");
  const div = fila.querySelector(".msg");
  const img = document.createElement("img");
  img.src = imagen.url;
  img.alt = "Imagen pegada";
  img.className = "msg-img";
  div.textContent = "";
  div.appendChild(img);
  if (textoExtra) {
    const p = document.createElement("div");
    p.textContent = textoExtra;
    p.style.marginTop = "8px";
    div.appendChild(p);
  }
  return fila;
}

// ---------- Archivos adjuntos ----------
let archivoActual = null;
const TEXTO_EXT = ["txt", "md", "csv", "json", "js", "html", "htm", "css", "svg", "xml", "py", "lua", "c", "cpp", "h", "java", "ts", "log", "ini", "yml", "yaml"];

function analizarArchivo(a) {
  const ext = (a.nombre.split(".").pop() || "").toLowerCase();
  const lineas = [
    `📄 Archivo: ${a.nombre}`,
    `🗂️ Tipo: ${a.tipo || ext || "desconocido"} · ${(a.tamano / 1024).toFixed(1)} KB`
  ];

  if (a.url) {
    lineas.push(`🖼️ Imagen de ${a.ancho}×${a.alto} px. Todavía no puedo describir lo que muestra.`);
    return lineas.join("\n");
  }
  if (a.texto === null) {
    lineas.push("No puedo leer el contenido de este tipo de archivo; solo muestro sus datos.");
    return lineas.join("\n");
  }

  const filas = a.texto.split("\n");
  const numPalabras = a.texto.trim() ? a.texto.trim().split(/\s+/).length : 0;
  lineas.push(`📏 ${filas.length} líneas · ${numPalabras} palabras · ${a.texto.length} caracteres`);

  if (ext === "json") {
    try {
      const obj = JSON.parse(a.texto);
      const detalle = Array.isArray(obj)
        ? `lista de ${obj.length} elementos`
        : `objeto con claves: ${Object.keys(obj).slice(0, 10).join(", ")}`;
      lineas.push(`✅ JSON válido: ${detalle}`);
    } catch (e) {
      lineas.push(`❌ El JSON no es válido: ${e.message}`);
    }
  }
  if (["html", "htm"].includes(ext)) {
    lineas.push(`🏷️ Etiquetas HTML aproximadas: ${(a.texto.match(/<[a-zA-Z]/g) || []).length}`);
  }
  if (["js", "lua", "py", "c", "cpp", "java", "ts"].includes(ext)) {
    const funciones = (a.texto.match(/function\s+\w+|def\s+\w+|local function\s+\w+/g) || []).length;
    lineas.push(`🧩 Funciones detectadas: ${funciones}`);
  }

  const primeras = filas.map((l) => l.trim()).filter(Boolean).slice(0, 5);
  if (primeras.length) {
    lineas.push("👀 Primeras líneas:\n" + primeras.map((l) => `  ${l.slice(0, 120)}`).join("\n"));
  }
  return lineas.join("\n");
}

async function recibirArchivo(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const esImagen = file.type.startsWith("image/");
  const esTexto = !esImagen && (TEXTO_EXT.includes(ext) || file.type.startsWith("text/") || file.type === "application/json");
  const info = { nombre: file.name, tipo: file.type, tamano: file.size, texto: null, url: null, ancho: null, alto: null };

  if (esTexto) {
    info.texto = await file.slice(0, 200000).text();
  }
  if (esImagen) {
    info.url = await new Promise((res) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsDataURL(file);
    });
    await new Promise((res) => {
      const img = new Image();
      img.onload = () => { info.ancho = img.naturalWidth; info.alto = img.naturalHeight; res(); };
      img.src = info.url;
    });
    agregarImagen(info);
  } else {
    agregarMensaje(`📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`, "usuario");
  }

  archivoActual = info;
  agregarMensaje(`Archivo recibido. Escribe "analiza el archivo", "resume el archivo" o "qué dice el archivo".`, "eloboth");
}

document.getElementById("adjuntar").onclick = () => document.getElementById("archivoInput").click();
document.getElementById("archivoInput").onchange = (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) recibirArchivo(f);
};

entradaForm.onsubmit = async (e) => {
  e.preventDefault();

    msg = msg ? `${modoActivo.prefijo} ${msg}` : modoActivo.prefijo;
  }

  if (!msg && !imagen) return;

  if (imagen) {
    agregarImagen(imagen, msg);
    limpiarImagen();

    agregarMensaje(msg, "usuario");
  }
  texto.value = "";

  if (imagen && !msg) {
    agregarMensaje(`📷 Imagen recibida (${imagen.ancho}×${imagen.alto} px). Todavía no puedo analizar su contenido, pero dime qué quieres hacer con ella.`, "eloboth");
    return;
  }

  const pensando = agregarMensaje("", "eloboth pensando");
  const cuerpo = pensando.querySelector(".msg");
  cuerpo.innerHTML = '<span class="puntos"><span></span><span></span><span></span></span>';
  progreso = (linea) => { cuerpo.textContent = linea; };

  try {
    let respuesta = await procesarComando(msg);
    if (imagen) {
      respuesta = `📷 Recibí tu imagen (${imagen.ancho}×${imagen.alto} px) junto con tu mensaje. Todavía no puedo analizar su contenido.\n\n${respuesta}`;
    }
    pensando.remove();
    agregarMensaje(respuesta, respuesta.startsWith("<svg") ? "eloboth svg" : "eloboth");
  } catch (err) {
    pensando.remove();
    agregarMensaje(`Error en el procesamiento: ${err.message}`, "eloboth");
  }
};

}

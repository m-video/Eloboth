<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eloboth - Agente Inteligente</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230d1330%22/><rect x=%2216%22 y=%2222%22 width=%2268%22 height=%2254%22 rx=%2214%22 fill=%22%23232a4a%22/><rect x=%2230%22 y=%2243%22 width=%2212%22 height=%2216%22 rx=%226%22 fill=%22%2300e5ff%22/><rect x=%2258%22 y=%2243%22 width=%2212%22 height=%2216%22 rx=%226%22 fill=%22%2300e5ff%22/></svg>">
<style>
  :root {
    --bg: #070b1a;
    --bg2: #0d1330;
    --panel: #111a3a;
    --panel-2: #172249;
    --cuerpo: #1f2640;
    --cuerpo-claro: #2b3558;
    --texto: #e6ecff;
    --suave: #8b97c4;
    --borde: rgba(120, 140, 255, .18);
    --cian: #00e5ff;
    --cian-suave: rgba(0, 229, 255, .35);
    --violeta: #6c4cff;
    --violeta-2: #9a5cff;
    --glow: 0 0 24px rgba(0, 229, 255, .25);
    --sombra: 0 10px 40px rgba(0, 0, 0, .45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(108, 76, 255, .25), transparent 60%),
      radial-gradient(800px 500px at 110% 110%, rgba(0, 229, 255, .18), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(120, 140, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 140, 255, .05) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 80%);
  }
  button, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s, border-color .2s; }
  button:active { transform: scale(.97); }

  /* ---------- Robot face (reutilizable) ---------- */
  .robot {
    position: relative; display: grid; place-items: center;
    background: linear-gradient(160deg, #2c3557, #151b33);
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: inset 0 2px 6px rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.4);
  }
  .robot .pantalla {
    position: absolute; background: #05070f;
    box-shadow: inset 0 0 0 2px #39416b, 0 0 0 1px rgba(255,255,255,.05);
  }
  .robot .ojos { display: flex; gap: 14%; align-items: center; justify-content: center; }
  .robot .ojo {
    background: var(--cian); border-radius: 30%;
    box-shadow: 0 0 10px var(--cian), 0 0 22px rgba(0,229,255,.55);
    animation: parpadeo 5s infinite;
  }
  .robot .ojo.der { animation-delay: .08s; }
  @keyframes parpadeo {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }
  .robot .auricular {
    position: absolute; top: -18%; left: -10%; right: -10%; height: 58%;
    border: 6px solid var(--violeta); border-bottom: 0; border-radius: 999px 999px 0 0;
    box-shadow: 0 0 14px rgba(108,76,255,.5);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px; padding: 12px 22px;
    background: rgba(13, 19, 48, .75); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--borde);
  }
  .avatar { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; }
  .avatar .pantalla { inset: 20% 16%; border-radius: 8px; }
  .avatar .ojo { width: 6px; height: 9px; }
  .avatar .ojos { position: absolute; inset: 0; }
  .avatar .auricular { top: -14%; left: -6%; right: -6%; height: 50%; border-width: 3px; }
  .marca { flex: 1; min-width: 0; }
  .marca b { display: block; font-size: 17px; letter-spacing: .3px; }
  .estado { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--suave); }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: #3dffa2; box-shadow: 0 0 8px #3dffa2; animation: pulso 2s infinite; }
  @keyframes pulso { 50% { opacity: .4; } }

  .boton {
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--borde);
    background: rgba(255,255,255,.03); font-size: 14px; font-weight: 500;
  }
  .boton:hover { border-color: var(--cian-suave); box-shadow: var(--glow); }
  .boton.principal {
    background: linear-gradient(135deg, var(--violeta), var(--cian));
    border: 0; color: #04101a; font-weight: 700;
  }
  .boton.principal:hover { box-shadow: 0 0 22px rgba(0,229,255,.45); }

  /* ---------- Login ---------- */
  #login-container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 18px; text-align: center; padding: 24px; max-width: 480px; margin: 0 auto; width: 100%;
  }
  .login-robot { width: 150px; height: 150px; border-radius: 42px; }
  .login-robot .pantalla { inset: 26% 18%; border-radius: 22px; }
  .login-robot .ojo { width: 26px; height: 36px; }
  .login-robot .auricular { top: -16%; left: -12%; right: -12%; height: 52%; border-width: 10px; }
  .login-robot .ojos { position: absolute; inset: 0; }
  #login-container h2 {
    margin: 6px 0 0; font-size: 28px; letter-spacing: -.3px;
    background: linear-gradient(90deg, #fff, var(--cian));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #login-container p { margin: 0; color: var(--suave); line-height: 1.6; font-size: 15px; }
  .campo {
    padding: 14px 18px; border-radius: 12px; border: 1px solid var(--borde);
    background: var(--bg2); font-size: 16px; width: 100%; text-align: center; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .campo:focus { border-color: var(--cian); box-shadow: var(--glow); }
  #loginBtn { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; }

  /* ---------- Chat ---------- */
  #chat { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 28px 18px; display: none; scroll-behavior: smooth; }
  #mensajes { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .fila-msg { display: flex; gap: 10px; align-items: flex-end; animation: entrar .35s ease; }
  .fila-msg.usuario { justify-content: flex-end; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .mini-robot { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; }
  .mini-robot .pantalla { inset: 22% 14%; border-radius: 6px; }
  .mini-robot .ojo { width: 4px; height: 6px; }
  .mini-robot .ojos { position: absolute; inset: 0; }
  .mini-robot .auricular { top: -16%; left: -8%; right: -8%; height: 50%; border-width: 2px; }

  .msg {
    max-width: 78%; padding: 13px 17px; border-radius: 18px; line-height: 1.6;
    word-break: break-word; font-size: 15px; white-space: pre-wrap;
  }
  .usuario.msg {
    background: linear-gradient(135deg, var(--violeta), #3a5bff);
    color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 6px 20px rgba(108,76,255,.3);
  }
  .eloboth.msg {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--borde); border-bottom-left-radius: 4px;
    box-shadow: var(--sombra); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 14px;
  }
  .eloboth.msg::before {
    content: "eloboth@chat:~$ "; display: block; color: var(--cian); font-size: 12px; opacity: .8; margin-bottom: 6px;
  }
  .eloboth.pensando { color: var(--suave); }
  .eloboth.pensando::before { content: none; }
  .puntos span {
    display: inline-block; width: 6px; height: 6px; margin: 0 3px; border-radius: 50%;
    background: var(--cian); animation: rebote 1.2s infinite ease-in-out;
  }
  .puntos span:nth-child(2) { animation-delay: .15s; }
  .puntos span:nth-child(3) { animation-delay: .3s; }
  @keyframes rebote { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

  pre { background: #05070f; color: #bfe9ff; padding: 14px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--borde); margin: 8px 0 0; }
  code { font-family: ui-monospace, Consolas, monospace; background: rgba(0,229,255,.08); color: var(--cian); padding: 2px 6px; border-radius: 6px; }

  /* ---------- Entrada ---------- */
  #entrada {
    position: relative; z-index: 2;
    background: rgba(13, 19, 48, .8); backdrop-filter: blur(10px);
    border-top: 1px solid var(--borde); padding: 16px; display: none;
  }
  #entrada .fila {
    max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg2); border: 1px solid var(--borde); border-radius: 16px; padding: 8px 8px 8px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  #entrada .fila:focus-within { border-color: var(--cian-suave); box-shadow: var(--glow); }
  #texto {
    flex: 1; min-width: 0; resize: none; min-height: 44px; max-height: 180px; padding: 10px 0;
    border: 0; background: transparent; outline: none;
  }
  #texto::placeholder { color: var(--suave); }
  #enviar { padding: 11px 20px; border-radius: 12px; }

  /* ---------- Layout con barra de conversaciones ---------- */
  #cuerpo { position: relative; z-index: 1; flex: 1; display: flex; min-height: 0; }
  #principal { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #barra {
    width: 260px; flex-shrink: 0; display: none; flex-direction: column; gap: 12px; padding: 14px;
    background: rgba(13, 19, 48, .7); border-right: 1px solid var(--borde); min-height: 0;
  }
  body.con-sesion #barra { display: flex; }
  #barra h3 {
    margin: 6px 4px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--suave);
  }
  #nuevaChat { width: 100%; padding: 10px; border-radius: 12px; }
  #listaChats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-item {
    display: flex; align-items: center; gap: 6px; padding: 10px; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent;
  }
  .chat-item:hover { background: rgba(255, 255, 255, .04); }
  .chat-item.activo { border-color: var(--cian-suave); background: rgba(0, 229, 255, .07); }
  .chat-item .titulo {
    flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-item .borrar {
    background: none; border: 0; color: var(--suave); padding: 2px 6px; border-radius: 6px; font-size: 13px;
  }
  .chat-item .borrar:hover { color: #ff6b8a; }
  @media (max-width: 700px) {
    #barra { width: 200px; }
  }

  /* ---------- Imágenes ---------- */
  .previa {
    display: flex; align-items: center; gap: 12px; max-width: 860px; margin: 0 auto 10px;
    padding: 8px; background: var(--bg2); border: 1px solid var(--cian-suave); border-radius: 14px;
  }
  .previa[hidden] { display: none !important; }
  #previaImg { height: 56px; width: auto; border-radius: 8px; border: 1px solid var(--borde); }
  .previa .boton { margin-left: auto; }
  .msg-img { display: block; max-width: 100%; max-height: 320px; border-radius: 12px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 600px) {
    .msg { max-width: 88%; font-size: 14px; }
    header { padding: 10px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="avatar robot">
    <div class="auricular"></div>
    <div class="pantalla" style="inset:20% 16%;border-radius:8px;"></div>
    <div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div>
  </div>
  <div class="marca">
    <b>Eloboth</b>
    <div class="estado"><span class="punto"></span><span id="userInfo">Sesión no iniciada</span></div>
  </div>
  <button class="boton" id="logoutBtn" type="button" style="display:none;">Salir</button>
</header>

<div id="cuerpo">
<aside id="barra">
  <button class="boton principal" id="nuevaChat" type="button">+ Nueva conversación</button>
  <h3>Conversaciones</h3>
  <div id="listaChats"></div>
</aside>
<section id="principal">
<div id="login-container">
  <div class="login-robot robot">
    <div class="auricular"></div>
    <div class="pantalla"></div>
    <div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div>
  </div>
  <h2>¡Hola! Soy Eloboth</h2>
  <p>Agente inteligente con análisis sintáctico palabra por palabra y memoria persistente en Firestore.</p>
  <input class="campo" id="nombreUsuario" type="text" placeholder="Escribe tu nombre">
  <button class="boton principal" id="loginBtn" type="button">Iniciar sesión</button>
</div>

<main id="chat"><div id="mensajes"></div></main>

<form id="entrada">
  <div id="previa" class="previa" hidden>
    <img id="previaImg" alt="Vista previa">
    <button type="button" class="boton" id="quitarImg">Quitar</button>
  </div>
  <div class="fila">
    <textarea id="texto" rows="1" placeholder="Escribe tu mensaje o: Aprende que X significa Y"></textarea>
    <button class="boton principal" id="enviar" type="submit">Enviar</button>
  </div>
</form>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDrOCa17n2IqDH4_UcBmFHLejsxfh4Ihcs",
  authDomain: "elboth-server.firebaseapp.com",
  projectId: "elboth-server",
  storageBucket: "elboth-server.firebasestorage.app",
  messagingSenderId: "73743894774",
  appId: "1:73743894774:web:0f8c2e98c94da1535044d7",
};

let db = null;
try {
  db = getFirestore(initializeApp(FIREBASE_CONFIG));
} catch (e) {
  console.warn("Error al conectar con Firestore:", e);
}

const loginContainer = document.getElementById("login-container");
const chatSection = document.getElementById("chat");
const entradaForm = document.getElementById("entrada");
const userInfo = document.getElementById("userInfo");
const logoutBtn = document.getElementById("logoutBtn");
const loginBtn = document.getElementById("loginBtn");
const nombreInput = document.getElementById("nombreUsuario");
const mensajes = document.getElementById("mensajes");
const texto = document.getElementById("texto");

// Almacenamiento seguro: si localStorage está bloqueado (iframes, modo privado),
// usa memoria para que el inicio de sesión funcione igualmente.
const almacen = (() => {
  try {
    localStorage.setItem("__test__", "1");
    localStorage.removeItem("__test__");
    return localStorage;
  } catch (e) {
    const mem = {};
    return {
      getItem: (k) => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: (k) => { delete mem[k]; },
    };
  }
})();

let usuarioActual = almacen.getItem("eloboth_usuario");

const MINI_ROBOT = `<div class="mini-robot robot"><div class="auricular"></div><div class="pantalla"></div><div class="ojos"><div class="ojo"></div><div class="ojo der"></div></div></div>`;

function actualizarInterfaz() {
  document.body.classList.toggle("con-sesion", !!usuarioActual);
  if (usuarioActual) {
    userInfo.textContent = `Usuario: ${usuarioActual}`;
    loginContainer.style.display = "none";
    chatSection.style.display = "block";
    entradaForm.style.display = "block";
    logoutBtn.style.display = "inline-block";
  } else {
    userInfo.textContent = "Sesión no iniciada";
    loginContainer.style.display = "flex";
    chatSection.style.display = "none";
    entradaForm.style.display = "none";
    logoutBtn.style.display = "none";
  }
}

nombreInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loginBtn.click();
});

loginBtn.onclick = () => {
  const val = nombreInput.value.trim();
  if (!val) {
    nombreInput.placeholder = "Primero escribe tu nombre";
    nombreInput.focus();
    return;
  }
  usuarioActual = val;
  almacen.setItem("eloboth_usuario", usuarioActual);
  nombreInput.value = "";
  cargarChats();
  actualizarInterfaz();
  renderizarBarra();
  renderizarMensajes();
  if (!chatActual().mensajes.length) {
    agregarMensaje(`¡Hola, ${usuarioActual}! Soy Eloboth. Estoy listo para procesar e ir aprendiendo nuevos conceptos.`, "eloboth");
  }
};

logoutBtn.onclick = () => {
  almacen.removeItem("eloboth_usuario");
  usuarioActual = null;
  mensajes.innerHTML = "";
  estado = { activo: null, chats: [] };
  listaChats.innerHTML = "";
  actualizarInterfaz();
};

// ---------- Conversaciones (guardadas en este navegador, por usuario) ----------
const listaChats = document.getElementById("listaChats");
let estado = { activo: null, chats: [] };
const TITULO_BASE = "Nueva conversación";

function claveChats() { return "eloboth_chats_" + usuarioActual; }

function guardarChats() {
  try {
    almacen.setItem(claveChats(), JSON.stringify(estado));
  } catch (e) {
    console.warn("No se pudieron guardar las conversaciones:", e);
  }
}

function nuevoId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function chatActual() {
  return estado.chats.find((c) => c.id === estado.activo);
}

function cargarChats() {
  try {
    estado = JSON.parse(almacen.getItem(claveChats())) || { activo: null, chats: [] };
  } catch (e) {
    estado = { activo: null, chats: [] };
  }
  if (!Array.isArray(estado.chats)) estado.chats = [];
  if (estado.chats.length === 0) {
    estado.chats.push({ id: nuevoId(), titulo: TITULO_BASE, mensajes: [] });
  }
  if (!estado.chats.some((c) => c.id === estado.activo)) {
    estado.activo = estado.chats[0].id;
  }
  guardarChats();
}

function renderizarBarra() {
  listaChats.innerHTML = "";
  for (const c of estado.chats) {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === estado.activo ? " activo" : "");
    const titulo = document.createElement("span");
    titulo.className = "titulo";
    titulo.textContent = c.titulo;
    const borrar = document.createElement("button");
    borrar.className = "borrar";
    borrar.type = "button";
    borrar.title = "Eliminar conversación";
    borrar.textContent = "✕";
    borrar.onclick = (e) => {
      e.stopPropagation();
      eliminarChat(c.id);
    };
    item.append(titulo, borrar);
    item.onclick = () => cambiarChat(c.id);
    listaChats.appendChild(item);
  }
}

function renderizarMensajes() {
  mensajes.innerHTML = "";
  const c = chatActual();
  if (c) c.mensajes.forEach((m) => pintarMensaje(m.texto, m.clase));
  chatSection.scrollTop = chatSection.scrollHeight;
}

function cambiarChat(id) {
  estado.activo = id;
  guardarChats();
  renderizarBarra();
  renderizarMensajes();
}

function crearChat() {
  const chat = { id: nuevoId(), titulo: TITULO_BASE, mensajes: [] };
  estado.chats.unshift(chat);
  cambiarChat(chat.id);
  texto.focus();
}

function eliminarChat(id) {
  const idx = estado.chats.findIndex((c) => c.id === id);
  if (idx === -1) return;
  estado.chats.splice(idx, 1);
  if (estado.chats.length === 0) {
    estado.chats.push({ id: nuevoId(), titulo: TITULO_BASE, mensajes: [] });
  }
  if (estado.activo === id) estado.activo = estado.chats[0].id;
  guardarChats();
  renderizarBarra();
  renderizarMensajes();
}

document.getElementById("nuevaChat").onclick = () => crearChat();

function agregarMensaje(textoMsj, clase) {
  const transitorio = clase.includes("pensando");
  const fila = pintarMensaje(textoMsj, clase);
  if (!transitorio) {
    const c = chatActual();
    if (c) {
      if (clase === "usuario" && c.titulo === TITULO_BASE && textoMsj) {
        c.titulo = textoMsj.slice(0, 32) + (textoMsj.length > 32 ? "…" : "");
      }
      c.mensajes.push({ texto: textoMsj, clase });
      guardarChats();
      renderizarBarra();
    }
  }
  return fila;
}

function pintarMensaje(textoMsj, clase) {
  const fila = document.createElement("div");
  fila.className = "fila-msg " + (clase === "usuario" ? "usuario" : "");
  if (clase !== "usuario") fila.insertAdjacentHTML("beforeend", MINI_ROBOT);
  const div = document.createElement("div");
  div.className = "msg " + clase;
  div.textContent = textoMsj;
  fila.appendChild(div);
  mensajes.appendChild(fila);
  chatSection.scrollTop = chatSection.scrollHeight;
  return fila;
}

function normalizarTexto(str) {
  return str
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, "")
    .trim();
}

function tokenizarPalabras(str) {
  const norm = normalizarTexto(str);
  return norm ? norm.split(/\s+/) : [];
}

async function buscarEnWikipedia(termino) {
  try {
    const url = `https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(termino)}&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.query && data.query.search.length > 0) {
      const snippet = data.query.search[0].snippet.replace(/(<([^>]+)>)/gi, "");
      return `📚 Wikipedia [${data.query.search[0].title}]:\n"${snippet}..."`;
    }
    return "No se encontraron resultados en Wikipedia.";
  } catch (e) {
    return "Error al conectar con Wikipedia.";
  }
}

async function buscarMemoriaAprendida(termino) {
  if (!db) return null;
  try {
    const querySnapshot = await getDocs(collection(db, "eloboth_aprendizajes"));
    const busquedaNorm = normalizarTexto(termino);
    for (const docSnap of querySnapshot.docs) {
      const data = docSnap.data();
      if (data.palabra && normalizarTexto(data.palabra) === busquedaNorm) {
        return data.definicion;
      }
    }
  } catch (err) {
    console.error("Error al consultar la memoria de Firestore:", err);
  }
  return null;
}

async function guardarAprendizajeFirestore(palabra, definicion) {
  if (!db) {
    console.error("La base de datos Firestore no está inicializada.");
    return { ok: false, error: "Base de datos no disponible." };
  }
  try {
    await addDoc(collection(db, "eloboth_aprendizajes"), {
      palabra: palabra.trim(),
      definicion: definicion.trim(),
      usuario: usuarioActual || "Anónimo",
      fecha: new Date().toISOString()
    });
    return { ok: true };
  } catch (err) {
    console.error("Error al escribir en Firestore:", err);
    return { ok: false, error: err.message };
  }
}

function generarListaMasivaOraciones(palabra) {
  const patrones = [
    `El concepto de ${palabra} es esencial en el análisis contemporáneo.`,
    `A través de ${palabra}, logramos estructurar ideas de manera clara y precisa.`,
    `¿Cómo influye ${palabra} en el desarrollo de nuestras tareas cotidianas?`,
    `Al aplicar ${palabra} correctamente, se optimizan los resultados deseados.`,
    `El estudio profundo sobre ${palabra} permite comprender mejor su contexto.`,
    `Integrar ${palabra} fortalece la consistencia del mensaje formulado.`,
    `Cada aspecto relacionado con ${palabra} aporta un valor significativo al conjunto.`,
    `La correcta interpretación de ${palabra} evita confusiones en la comunicación.`
  ];

  let resultado = `📄 Generación masiva de 1,000 oraciones para "${palabra}":\n\n`;
  for (let i = 1; i <= 1000; i++) {
    const patron = patrones[(i - 1) % patrones.length];
    resultado += `${i}. ${patron} (Variación #${i})\n`;
  }
  return resultado;
}

const PERSONAS = ["yo", "tú", "él/ella", "nosotros", "vosotros", "ellos"];
const TIEMPOS = {
  pres: "presente de indicativo",
  pret: "pretérito indefinido",
  imp: "pretérito imperfecto",
  fut: "futuro simple",
  cond: "condicional simple"
};
const TERM_FUT = ["é", "ás", "á", "emos", "éis", "án"];
const TERM_COND = ["ía", "ías", "ía", "íamos", "íais", "ían"];
const TERM_IMP_AR = ["aba", "abas", "aba", "ábamos", "abais", "aban"];

function construirIndiceConjugaciones() {
  const indice = new Map();
  const agregar = (forma, verbo, tiempo, i) => {
    const k = normalizarTexto(forma);
    if (!indice.has(k)) indice.set(k, []);
    indice.get(k).push({ verbo, tiempo, persona: PERSONAS[i] });
  };

  for (const [verbo, d] of Object.entries(CONJUGACIONES)) {
    const raizBase = verbo.slice(0, -2);
    const raizFut = d.fut || verbo;
    const formas = {
      pres: d.pres.split(" "),
      pret: d.pret.split(" "),
      imp: d.imp
        ? d.imp.split(" ")
        : (verbo.endsWith("ar") ? TERM_IMP_AR : ["ía", "ías", "ía", "íamos", "íais", "ían"]).map((t) => raizBase + t),
      fut: TERM_FUT.map((t) => raizFut + t),
      cond: TERM_COND.map((t) => raizFut + t)
    };
    for (const tiempo of Object.keys(formas)) {
      formas[tiempo].forEach((forma, i) => agregar(forma, verbo, tiempo, i));
    }
  }
  return indice;
}

const INDICE_CONJ = construirIndiceConjugaciones();

// ---------- Interpretación palabra por palabra ----------
async function cargarMemoriaMapa() {
  const mapa = new Map();
  if (!db) return mapa;
  try {
    const snap = await getDocs(collection(db, "eloboth_aprendizajes"));
    snap.docs.forEach((d) => {
      const data = d.data();
      if (data.palabra) mapa.set(normalizarTexto(data.palabra), data.definicion);
    });
  } catch (err) {
    console.error("Error al cargar la memoria:", err);
  }
  return mapa;
}

function significadosDePalabra(palabra, memoria) {
  const out = [];
  if (memoria.has(palabra)) {
    out.push({ fuente: "memoria", texto: memoria.get(palabra) });
  }
  const hits = INDICE_CONJ.get(palabra);
  if (hits) {
    out.push({
      fuente: "conjugación",
      texto: hits.map((h) => `${TIEMPOS[h.tiempo]}, ${h.persona} de ${h.verbo}`).join("; ")
    });
  }
  return out;
}

async function interpretarOracion(msgOriginal) {
  const palabrasOriginales = msgOriginal.split(/\s+/).filter(Boolean);
  const memoria = await cargarMemoriaMapa();
  const conocidas = [];
  const desconocidas = [];

  for (const original of palabrasOriginales) {
    const norm = normalizarTexto(original);
    if (!norm) continue;
    const sig = significadosDePalabra(norm, memoria);
    if (sig.length) {
      conocidas.push({ palabra: original, sig });
    } else {
      desconocidas.push(original);
    }
  }

  if (conocidas.length === 0) return null;

  const detalle = conocidas.map((c) => `• "${c.palabra}": ${c.sig.map((s) => s.texto).join(" | ")}`);
  const combinado = conocidas.map((c) => c.sig[0].texto).join(" + ");

  const PALABRAS_INTERROGATIVAS = ["que", "quien", "quienes", "cual", "cuales", "como", "donde", "adonde", "cuando", "cuanto", "cuanta", "cuantos", "cuantas", "por", "para"];
  const primera = normalizarTexto(palabrasOriginales[0] || "");
  const esPregunta = PALABRAS_INTERROGATIVAS.includes(primera) || msgOriginal.includes("?");
  const tipo = esPregunta ? "pregunta" : "enunciado";
  const contexto = esPregunta
    ? "Estás preguntando por algo; busco la definición de cada palabra para responder."
    : "Es una afirmación; reviso el significado de cada palabra para entenderla.";

  let resp = `🧩 Análisis de tu ${tipo}\n\n📝 Palabra por palabra:\n${detalle.join("\n")}`;
  resp += `\n\n🔗 Significado combinado: ${combinado}`;
  resp += `\n\n🧭 Contexto: ${contexto}`;
  if (desconocidas.length) {
    resp += `\n\n❓ No conozco: ${desconocidas.map((d) => `"${d}"`).join(", ")}. Puedes enseñármelas con "Aprende que X significa Y".`;
  } else {
    resp += "\n\n✅ Conozco todas las palabras de tu oración.";
  }
  return resp;
}

// Resumen de Wikipedia (primer párrafo) para un término concreto
async function buscarResumenWikipedia(termino) {
  try {
    const url = `https://es.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(termino)}&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const paginas = data.query?.pages ? Object.values(data.query.pages) : [];
    const pagina = paginas.find((p) => p.extract && !("missing" in p));
    if (!pagina) return null;
    const primeraFrase = pagina.extract.trim().split(/(?<=\.)\s/)[0];
    return { titulo: pagina.title, primeraFrase };
  } catch (e) {
    return null;
  }
}

let progreso = () => {};
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

async function responderOracion(msgOriginal) {
  const palabrasOriginales = msgOriginal.split(/\s+/).filter(Boolean);
  const memoria = await cargarMemoriaMapa();
  const conocidas = [];
  const desconocidas = [];

  for (const original of palabrasOriginales) {
    const norm = normalizarTexto(original);
    if (!norm) continue;
    progreso(`🔎 Analizando "${original}"...`);
    await esperar(350);
    const sig = significadosDePalabra(norm, memoria);
    if (sig.length) {
      conocidas.push({ palabra: original, sig });
      progreso(`✔ "${original}" → ${sig[0].texto}`);
    } else {
      desconocidas.push(original);
      progreso(`❓ "${original}" no está en mi memoria`);
    }
    await esperar(250);
  }

  progreso("🧠 Juntando los significados...");
  await esperar(400);

  const norm = normalizarTexto(msgOriginal);
  const PALABRAS_INTERROGATIVAS = ["que", "quien", "quienes", "cual", "cuales", "como", "donde", "adonde", "cuando", "cuanto", "cuanta", "cuantos", "cuantas", "por", "para"];
  const primera = normalizarTexto(palabrasOriginales[0] || "");
  const esPregunta = PALABRAS_INTERROGATIVAS.includes(primera) || msgOriginal.includes("?");

  // "qué es X" / "quién es X": responde con lo que sabe de X
  const pregunta = norm.match(/^(que|quien|quienes)\s+(es|son)\s+(.+)$/);
  if (pregunta) {
    const sujeto = pregunta[3].trim();
    const nombre = sujeto.replace(/\b\w/g, (c) => c.toUpperCase());
    const definicion = memoria.get(sujeto);
    if (definicion) {
      return `✅ Entendí el contexto de tu oración: preguntas qué es ${nombre}.\n\n💬 ${nombre} es ${definicion}.`;
    }
    progreso(`🌐 No lo tengo en memoria. Busco "${nombre}" en Wikipedia...`);
    const wiki = await buscarResumenWikipedia(nombre);
    if (wiki) {
      return `✅ Entendí el contexto de tu oración: preguntas qué es ${nombre}.\n\n🌐 Según Wikipedia (${wiki.titulo}): ${wiki.primeraFrase}\n\n💡 Si quieres que la recuerde, escribe: "Aprende que ${sujeto} significa ${wiki.primeraFrase}"`;
    }
    return `✅ Entendí el contexto de tu oración: preguntas qué es ${nombre}.\n\n❓ No encontré "${nombre}" en Wikipedia ni lo tengo registrado. Enséñamelo con "Aprende que ${sujeto} significa [definición]".`;
  }

  if (conocidas.length === 0) return null;

  const combinado = conocidas.map((c) => c.sig[0].texto).join(" + ");
  let resp = `✅ Entendí el contexto de tu oración (${esPregunta ? "pregunta" : "enunciado"}).\n\n🔗 Significado combinado: ${combinado}`;
  if (desconocidas.length) {
    resp += `\n\n❓ No conozco: ${desconocidas.map((d) => `"${d}"`).join(", ")}.`;
  }
  return resp;
}

async function procesarComando(msgOriginal) {
  const norm = normalizarTexto(msgOriginal);
  const palabras = tokenizarPalabras(msgOriginal);

  // 1. Saludo estricto
  if (norm === "hola") {
    return "¡Hola!";
  }

  // 2. Aprendizaje ("Aprende que X significa Y"), una por línea
  const lineas = msgOriginal.split("\n");
  const resultadosAprendizaje = [];

  for (const linea of lineas) {
    const matchAprende = linea.trim().match(/^aprende que\s+(.+?)\s+significa\s+(.+)$/i);
    if (matchAprende) {
      const palabra = matchAprende[1].trim();
      const definicion = matchAprende[2].trim();
      const res = await guardarAprendizajeFirestore(palabra, definicion);
      if (res.ok) {
        resultadosAprendizaje.push(`✅ Guardado: "${palabra}" -> "${definicion}"`);
      } else {
        resultadosAprendizaje.push(`❌ Error al guardar "${palabra}": ${res.error}`);
      }
    }
  }

  if (resultadosAprendizaje.length > 0) {
    return resultadosAprendizaje.join("\n");
  }

  // 3. Consulta a Wikipedia bajo demanda
  if (palabras.includes("wikipedia") || norm.includes("busca en wiki") || norm.includes("investiga")) {
    const termino = msgOriginal.replace(/wikipedia|busca en wiki|investiga|sobre|de/gi, "").trim() || msgOriginal;
    return await buscarEnWikipedia(termino);
  }

  // 4. Generación masiva de oraciones
  if (norm.startsWith("genera oraciones") || norm.startsWith("formula oraciones")) {
    const palabra = msgOriginal.replace(/genera oraciones|formula oraciones|de|para/gi, "").trim() || "concepto";
    return generarListaMasivaOraciones(palabra);
  }

  // 4b. Escribir HTML según lo que pida (botón, formulario, tabla, página, etc.)
  const PLANTILLAS_HTML = {
    boton: `<button type="button" onclick="alert('¡Hola!')">Haz clic</button>`,
    formulario: `<form action="#" method="post">\n  <label for="nombre">Nombre:</label>\n  <input type="text" id="nombre" name="nombre">\n  <button type="submit">Enviar</button>\n</form>`,
    lista: `<ul>\n  <li>Elemento 1</li>\n  <li>Elemento 2</li>\n  <li>Elemento 3</li>\n</ul>`,
    tabla: `<table>\n  <thead>\n    <tr><th>Nombre</th><th>Edad</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Ana</td><td>25</td></tr>\n  </tbody>\n</table>`,
    enlace: `<a href="https://www.ejemplo.com" target="_blank">Visita el sitio</a>`,
    imagen: `<img src="imagen.jpg" alt="Descripción de la imagen" width="300">`,
    parrafo: `<p>Este es un párrafo de ejemplo.</p>`,
    pagina: `<!DOCTYPE html>\n<html lang="es">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Mi página</title>\n</head>\n<body>\n  <h1>¡Hola!</h1>\n  <p>Esta es mi primera página.</p>\n</body>\n</html>`
  };
  const pideEscribir = /\b(escriba|escribe|escribir|crea|crear|cree|genera|genere|generar|haz|hazme|dame|quiero|quieres|puedes)\b/.test(norm);
  if (palabras.includes("html") && pideEscribir) {
    let clave = Object.keys(PLANTILLAS_HTML).find((k) => palabras.includes(k));
    if (!clave && palabras.includes("link")) clave = "enlace";
    if (!clave) clave = "pagina";
    const nombre = clave === "pagina" ? "una página" : clave;
    return `Aquí tienes HTML de ${nombre}:\n\`\`\`html\n${PLANTILLAS_HTML[clave]}\n\`\`\``;
  }

  // 5. Generador de código "print"
  if (palabras.includes("print") || palabras.includes("imprimir") || palabras.includes("muestra")) {
    if (palabras.includes("html")) return `Estructura HTML:\n\`\`\`html\n<h1>¡Hola!</h1>\n\`\`\``;
    if (palabras.includes("javascript") || palabras.includes("js")) return `Código JavaScript:\n\`\`\`javascript\nconsole.log("¡Hola!");\n\`\`\``;
    if (palabras.includes("lua")) return `Script Lua:\n\`\`\`lua\nprint("¡Hola!")\n\`\`\``;
    if (palabras.includes("c") || palabras.includes("cpp")) return `Código C++:\n\`\`\`cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << "¡Hola!" << endl;\n    return 0;\n}\n\`\`\``;
  }

  // 6. Consulta en memoria de Firestore (oración completa o palabras clave)
  const memoriaOracion = await buscarMemoriaAprendida(msgOriginal);
  if (memoriaOracion) return `💡 Definición aprendida:\n"${memoriaOracion}"`;

  // Solo para una palabra; en oraciones lo maneja el análisis completo (paso 8)
  for (const p of palabras.length === 1 ? palabras : []) {
    if (p.length > 2) {
      const memoriaPalabra = await buscarMemoriaAprendida(p);
      if (memoriaPalabra) {
        return `💡 Sobre "${p}" tengo registrado:\n"${memoriaPalabra}"`;
      }
    }
  }

  // 6b. Conjugación de una sola palabra (no interfiere con frases)
  if (palabras.length === 1) {
    const hits = INDICE_CONJ.get(palabras[0]);
    if (hits) {
      const lista = hits.map((h) => `${TIEMPOS[h.tiempo]}, ${h.persona} de ${h.verbo}`);
      return `🔤 "${msgOriginal.trim()}":\n${lista.join("\n")}`;
    }
  }

  // 7. Respuestas conversacionales
  if (norm === "que es eso" || (palabras.includes("que") && palabras.includes("es") && palabras.includes("eso"))) {
    return "Analizando tu consulta [Palabras: 'que', 'es', 'eso'] -> Es una expresión para solicitar la definición de un objeto o concepto. Si deseas enseñarme uno, escribe: 'Aprende que [palabra] significa [definición]'.";
  }
  if (norm === "como estas" || (palabras.includes("como") && palabras.includes("estas"))) {
    return `¡Todo excelente por aquí! ¿Y tú, ${usuarioActual}, cómo estás?`;
  }
  if (norm === "bien y tu" || (palabras.includes("bien") && palabras.includes("tu"))) {
    return "¡Me alegro mucho! Yo estoy genial, listo para ayudarte.";
  }
  if (palabras.includes("gracias")) {
    return `¡De nada, ${usuarioActual}! Es un gusto ayudar.`;
  }

  // 8. Interpretación de la oración con las palabras que conoce
  if (palabras.length > 1) {
    const interpretacion = await responderOracion(msgOriginal);
    if (interpretacion) return interpretacion;
  }

  return `Entendido. He analizado las ${palabras.length} palabras de tu mensaje ("${palabras.join('", "')}"). No tengo un registro guardado sobre esta consulta. Puedes enseñármelo escribiendo: "Aprende que ${msgOriginal} significa [tu definición]".`;
}

// ---------- Imágenes pegadas (Ctrl+V / Cmd+V) ----------
let imagenPendiente = null;
const previa = document.getElementById("previa");
const previaImg = document.getElementById("previaImg");

function limpiarImagen() {
  imagenPendiente = null;
  previa.hidden = true;
  previaImg.removeAttribute("src");
}
document.getElementById("quitarImg").onclick = limpiarImagen;

texto.addEventListener("paste", (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  const item = items.find((it) => it.type.startsWith("image/"));
  if (!item) return;
  const file = item.getAsFile();
  if (!file) return;
  e.preventDefault();

  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;
    const img = new Image();
    img.onload = () => {
      imagenPendiente = { url, ancho: img.naturalWidth, alto: img.naturalHeight, tipo: file.type };
      previaImg.src = url;
      previa.hidden = false;
      texto.focus();
    };
    img.src = url;
  };
  reader.readAsDataURL(file);
});

function agregarImagen(imagen) {
  const fila = agregarMensaje("📷 Imagen pegada", "usuario");
  const div = fila.querySelector(".msg");
  const img = document.createElement("img");
  img.src = imagen.url;
  img.alt = "Imagen pegada";
  img.className = "msg-img";
  div.textContent = "";
  div.appendChild(img);
  return fila;
}

entradaForm.onsubmit = async (e) => {
  e.preventDefault();
  const msg = texto.value.trim();
  const imagen = imagenPendiente;
  if (!msg && !imagen) return;

  if (imagen) {
    agregarImagen(imagen);
    limpiarImagen();
  }
  if (msg) agregarMensaje(msg, "usuario");
  texto.value = "";

  if (imagen && !msg) {
    agregarMensaje(`📷 Imagen recibida (${imagen.ancho}×${imagen.alto} px). Todavía no puedo analizar su contenido, pero dime qué quieres hacer con ella.`, "eloboth");
    return;
  }

  const pensando = agregarMensaje("", "eloboth pensando");
  const cuerpo = pensando.querySelector(".msg");
  cuerpo.innerHTML = '<span class="puntos"><span></span><span></span><span></span></span>';
  progreso = (linea) => { cuerpo.textContent = linea; };

  try {
    const respuesta = await procesarComando(msg);
    pensando.remove();
    agregarMensaje(respuesta, "eloboth");
  } catch (err) {
    pensando.remove();
    agregarMensaje(`Error en el procesamiento: ${err.message}`, "eloboth");
  }
};

actualizarInterfaz();
if (usuarioActual) {
  cargarChats();
  renderizarBarra();
  renderizarMensajes();
  if (!chatActual().mensajes.length) {
    agregarMensaje(`¡Hola de nuevo, ${usuarioActual}! Eloboth está operativo.`, "eloboth");
  }
}
</script>
